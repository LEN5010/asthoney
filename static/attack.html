<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>攻击矩阵 · ASTHONEY 欺骗蜜网</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="attack">
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" data-sidebar-toggle>菜单</button>
        <a class="brand" href="/"><span class="brand-mark"></span>ASTHONEY<span class="brand-sub">欺骗防御工作台</span></a>
      </div>
      <div class="topbar-right"><span class="environment-label">课程实验环境 · 模拟处置</span>
        <span class="topbar-meta" id="lastUpdated">等待同步</span>
        <span class="health-dot" id="healthDot">检测中</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-group">
          <div class="sidebar-label">工作空间</div>
          <nav class="nav-list"></nav>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-label">系统状态</div>
          <div class="shell-status" id="shellStatus">
            <div class="shell-status-row"><span>加载中…</span></div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <div>
            <div class="eyebrow">ASTHONEY / 安全运营</div>
            <h1 class="content-title">ATT&amp;CK 观测矩阵</h1>
            <div class="content-subtitle">仅展示蜜网可观测的技术子集；选择技术查看原始证据。</div>
          </div>
          <div class="header-actions">
            <a class="link-button" href="/profiles/view">攻击者画像</a>
            <button class="button" id="refreshBtn" type="button">刷新数据</button>
          </div>
        </div>

        <section class="kpi-row">
          <div class="kpi">
            <div class="kpi-label"><span class="dot" style="background: var(--cat-1);"></span>覆盖战术</div>
            <p class="kpi-value" id="kpiTactics">0</p>
            <div class="kpi-sub">共 <strong id="kpiTacticsTotal">8</strong> 列</div>
          </div>
          <div class="kpi">
            <div class="kpi-label"><span class="dot" style="background: var(--cat-3);"></span>命中技术</div>
            <p class="kpi-value" id="kpiTechniques">0</p>
            <div class="kpi-sub">有观测记录的 ATT&amp;CK 技术</div>
          </div>
          <div class="kpi">
            <div class="kpi-label"><span class="dot" style="background: var(--cat-2);"></span>观测次数</div>
            <p class="kpi-value" id="kpiHits">0</p>
            <div class="kpi-sub">意图与告警映射合计</div>
          </div>
        </section>

        <section class="panel-grid">
          <article class="card span-12">
            <div class="card-header">
              <h2 class="card-title">战术与技术</h2>
              <span class="card-meta" id="matrixMeta">等待数据</span>
            </div>
            <div class="card-body">
              <div class="footnote matrix-hint">列数较多，左右滑动查看全部战术列 →</div>
              <div class="attack-matrix" id="matrix">
                <div class="skeleton" aria-hidden="true" style="grid-column: 1 / -1;">
                  <div class="skeleton-line" style="width:90%"></div>
                  <div class="skeleton-line" style="width:70%"></div>
                </div>
              </div>
              <div class="footnote">数字表示观测次数，不代表严重程度。点击技术筛选证据；未观测不等于不存在。</div>
            </div>
          </article>

          <article class="card span-12">
            <div class="card-header">
              <h2 class="card-title">证据摘录</h2><button class="link-button small" id="clearTechnique" type="button">全部证据</button>
              <span class="card-meta" id="evidenceMeta">0 条</span>
            </div>
            <div class="card-body">
              <div class="stack" id="evidenceList">
                <div class="empty-state">注入演示会话后，这里会列出支撑每个技术格子的原始输入。</div>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/pages/attack.js" defer></script>
</body>
</html>
