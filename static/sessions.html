<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSH Sessions</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" data-sidebar-toggle>菜单</button>
        <a class="brand" href="/">Generative Infinite Deception Maze</a>
      </div>
      <div class="topbar-right">
        <span class="topbar-meta" id="lastUpdated">等待刷新</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-group">
          <div class="sidebar-label">Navigation</div>
          <nav class="nav-list">
            <a class="nav-link" data-nav="overview" href="/"><span>总体态势</span><span class="nav-badge">Graph</span></a>
            <a class="nav-link" data-nav="sessions" href="/sessions/view"><span>SSH 会话</span><span class="nav-badge">Logs</span></a>
            <a class="nav-link" data-nav="docs" href="/docs"><span>API 文档</span><span class="nav-badge">OpenAPI</span></a>
          </nav>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-label">概览</div>
          <div class="inline-meta"></div>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <div>
            <h1 class="content-title">SSH 会话视图</h1>
            <div class="content-subtitle"></div>
          </div>
          <div class="topbar-right">
            <button class="link-button" id="purgeHistoryBtn" type="button">清空历史</button>
          </div>
        </div>

        <section class="panel-grid">
          <article class="card span-12">
            <div class="card-header">
              <h2 class="card-title">Session Index</h2>
              <span class="card-meta" id="sessionCount">0 sessions</span>
            </div>
            <div class="card-body">
              <div class="table">
                <div class="table-head">
                  <div>Session</div>
                  <div>Source</div>
                  <div>Commands</div>
                  <div>Replay</div>
                </div>
                <div id="sessionRows">
                  <div class="empty-state">暂无 SSH 会话</div>
                </div>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    initLayout("sessions");

    const sessionRowsEl = document.getElementById("sessionRows");
    const sessionCountEl = document.getElementById("sessionCount");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const purgeHistoryBtn = document.getElementById("purgeHistoryBtn");

    function renderSessions(sessions) {
      sessionCountEl.textContent = `${sessions.length} sessions`;
      if (!sessions.length) {
        sessionRowsEl.innerHTML = '<div class="empty-state">暂无 SSH 会话</div>';
        return;
      }
      sessionRowsEl.innerHTML = sessions.map((session) => `
        <div class="table-row">
          <div>
            <strong>${escapeHtml(session.session_id)}</strong>
            <div class="inline-meta">${escapeHtml(session.entry_hostname || session.entry_asset_id || "unknown")}</div>
          </div>
          <div>${escapeHtml(session.source_ip || "unknown")}</div>
          <div>${escapeHtml(session.command_count || 0)}</div>
          <div><a class="link-button" href="/session/view?session_id=${encodeURIComponent(session.session_id)}">终端回放</a></div>
        </div>
      `).join("");
    }

    async function refresh() {
      try {
        const resp = await fetch("/sessions");
        const payload = await resp.json();
        renderSessions(payload.sessions || []);
        lastUpdatedEl.textContent = `最近刷新 ${new Date().toLocaleString("zh-CN", { hour12: false })}`;
      } catch (error) {
        lastUpdatedEl.textContent = `刷新失败: ${error}`;
      }
    }

    purgeHistoryBtn.addEventListener("click", async () => {
      const accepted = window.confirm("这会清空已有会话、告警、动作和动态诱饵资产，是否继续？");
      if (!accepted) return;
      const savedToken = localStorage.getItem("adminToken") || "";
      const inputToken = window.prompt("请输入控制面管理令牌（X-Admin-Token）", savedToken);
      if (inputToken === null) return;
      const adminToken = inputToken.trim();
      localStorage.setItem("adminToken", adminToken);
      purgeHistoryBtn.disabled = true;
      purgeHistoryBtn.textContent = "清理中";
      try {
        const resp = await fetch("/history/purge", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Token": adminToken },
          body: JSON.stringify({ confirm: true }),
        });
        const payload = await resp.json();
        if (!resp.ok) throw new Error(payload.detail || "鉴权失败");
        if (!payload.ok) throw new Error(payload.message || "清理失败");
        await refresh();
        lastUpdatedEl.textContent = `历史已清空 ${new Date().toLocaleString("zh-CN", { hour12: false })}`;
      } catch (error) {
        lastUpdatedEl.textContent = `清理失败: ${error}`;
      } finally {
        purgeHistoryBtn.disabled = false;
        purgeHistoryBtn.textContent = "清空历史";
      }
    });

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
