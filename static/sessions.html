<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSH 会话 · ASTHONEY 欺骗蜜网</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="sessions">
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" data-sidebar-toggle>菜单</button>
        <a class="brand" href="/"><span class="brand-mark"></span>ASTHONEY<span class="brand-sub">欺骗防御工作台</span></a>
      </div>
      <div class="topbar-right"><span class="environment-label">课程实验环境 · 模拟处置</span>
        <span class="topbar-meta" id="lastUpdated">等待刷新</span>
        <span class="health-dot" id="healthDot">检测中</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-group">
          <div class="sidebar-label">工作空间</div>
          <nav class="nav-list"></nav>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-label">系统状态</div>
          <div class="shell-status" id="shellStatus">
            <div class="shell-status-row"><span>加载中…</span></div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <div>
            <div class="eyebrow">ASTHONEY / 安全运营</div>
            <h1 class="content-title">SSH 会话审计</h1>
            <div class="content-subtitle">检索交互记录，沿攻击路径复盘会话。</div>
          </div>
          <div class="header-actions">
            <button class="button" id="refreshBtn" type="button">刷新数据</button>
          </div>
        </div>

        <section class="panel-grid">
          <article class="card span-12">
            <div class="card-header">
              <h2 class="card-title">会话索引</h2>
              <span class="card-meta" id="sessionCount">0 条会话</span>
            </div>
            <div class="card-body">
              <div class="table-toolbar"><label class="search-field"><span>检索会话</span><input id="sessionSearch" type="search" placeholder="会话 ID 或来源 IP" autocomplete="off"></label><label class="sort-field"><span>排序</span><select id="sessionSort"><option value="recent">最近活动</option><option value="commands">命令数从多到少</option><option value="source">来源 IP</option></select></label><span class="card-meta">搜索范围：已加载记录</span></div><div class="table cols-sessions">
                <div class="table-head">
                  <div>会话</div>
                  <div>来源</div>
                  <div>命令数</div>
                  <div>攻击路径</div>
                  <div>最近命令</div>
                  <div>最后活动</div>
                  <div>操作</div>
                </div>
                <div id="sessionRows" class="rows">
                  <div class="skeleton" aria-hidden="true">
                    <div class="skeleton-line" style="width:95%"></div>
                    <div class="skeleton-line" style="width:85%"></div>
                    <div class="skeleton-line" style="width:70%"></div>
                  </div>
                </div>
              </div>
              <div class="footnote">清空历史仅删除会话、告警、动作与 JIT 合成资产，预置资产拓扑保留。</div>
            </div>
          </article>
        </section><details class="danger-zone"><summary>历史维护</summary><p>清理会话、告警、动作和动态资产，保留预置拓扑。此操作不可撤销。</p><button class="button danger-ghost" id="purgeHistoryBtn" type="button">清空历史</button></details>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/pages/sessions.js" defer></script>
</body>
</html>
