<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSH 会话 · ASTHONEY 欺骗蜜网</title>
  <link rel="stylesheet" href="/static/app.css">
  <style>
    .sessions-table .table-head,
    .sessions-table .table-row {
      grid-template-columns: 1.3fr 0.8fr 0.5fr 1.7fr 1.3fr 0.8fr 0.6fr;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" data-sidebar-toggle>菜单</button>
        <a class="brand" href="/"><span class="brand-mark"></span>ASTHONEY<span class="brand-sub">生成式欺骗蜜网</span></a>
      </div>
      <div class="topbar-right">
        <span class="topbar-meta" id="lastUpdated">等待刷新</span>
        <span class="health-dot" id="healthDot">检测中</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-group">
          <div class="sidebar-label">导航</div>
          <nav class="nav-list">
            <a class="nav-link" data-nav="overview" href="/"><span>总体态势</span><span class="nav-badge">Graph</span></a>
            <a class="nav-link" data-nav="sessions" href="/sessions/view"><span>SSH 会话</span><span class="nav-badge">Replay</span></a>
            <a class="nav-link" data-nav="docs" href="/docs"><span>API 文档</span><span class="nav-badge">OpenAPI</span></a>
          </nav>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-label">系统状态</div>
          <div class="shell-status" id="shellStatus">
            <div class="shell-status-row"><span>加载中…</span></div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <div>
            <h1 class="content-title">SSH 会话审计</h1>
            <div class="content-subtitle">每条会话包含完整攻击者输入与蜜罐响应，可进入终端回放并查看 AI 研判。</div>
          </div>
          <div class="header-actions">
            <button class="button danger-ghost" id="purgeHistoryBtn" type="button">清空历史</button>
          </div>
        </div>

        <section class="panel-grid">
          <article class="card span-12">
            <div class="card-header">
              <h2 class="card-title">会话索引</h2>
              <span class="card-meta" id="sessionCount">0 条会话</span>
            </div>
            <div class="card-body">
              <div class="table sessions-table">
                <div class="table-head">
                  <div>会话</div>
                  <div>来源</div>
                  <div>命令数</div>
                  <div>攻击路径</div>
                  <div>最近命令</div>
                  <div>最后活动</div>
                  <div>操作</div>
                </div>
                <div id="sessionRows" style="display: grid; gap: 6px;">
                  <div class="empty-state">暂无 SSH 会话</div>
                </div>
              </div>
              <div class="footnote">清空历史需要控制面管理令牌（X-Admin-Token），且仅删除会话、告警、动作与 JIT 合成资产，预置资产拓扑保留。</div>
            </div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    initLayout("sessions");

    const sessionRowsEl = document.getElementById("sessionRows");
    const sessionCountEl = document.getElementById("sessionCount");
    const lastUpdatedEl = document.getElementById("lastUpdated");
    const purgeHistoryBtn = document.getElementById("purgeHistoryBtn");

    function renderSessions(sessions) {
      sessionCountEl.textContent = `${sessions.length} 条会话`;
      if (!sessions.length) {
        sessionRowsEl.innerHTML = '<div class="empty-state">暂无 SSH 会话，可通过 nc 连接诱捕端口或使用 scripts/demo_smoke.sh 注入演示数据</div>';
        return;
      }
      sessionRowsEl.innerHTML = sessions.map((session) => {
        const hops = [session.entry_hostname, ...(session.visited_hosts || [])].filter(Boolean);
        const path = hops.length
          ? `<span class="path-flow">${hops.map((h) => `<span class="hop">${escapeHtml(truncate(h, 16))}</span>`).join('<span class="arrow">→</span>')}</span>`
          : '<span class="inline-meta">—</span>';
        return `
          <div class="table-row">
            <div>
              <div class="cell-main mono">${escapeHtml(truncate(session.session_id, 24))}</div>
              <div class="cell-sub">${escapeHtml(session.protocol || "ssh")} · 始于 ${fmtTime(session.created_at)}</div>
            </div>
            <div class="mono">${escapeHtml(session.source_ip || "unknown")}</div>
            <div class="mono">${escapeHtml(session.command_count ?? 0)}</div>
            <div>${path}</div>
            <div class="mono inline-meta" title="${escapeHtml(session.last_payload || "")}">${escapeHtml(truncate(session.last_payload || "—", 30))}</div>
            <div class="inline-meta">${timeAgo(session.last_seen)}</div>
            <div><a class="link-button" href="/session/view?session_id=${encodeURIComponent(session.session_id)}">回放</a></div>
          </div>
        `;
      }).join("");
    }

    async function refresh() {
      try {
        const payload = await fetchJSON("/sessions");
        renderSessions(payload.sessions || []);
        lastUpdatedEl.textContent = `最近刷新 ${new Date().toLocaleTimeString("zh-CN", { hour12: false })}`;
      } catch (error) {
        lastUpdatedEl.textContent = `刷新失败: ${error.message || error}`;
      }
    }

    purgeHistoryBtn.addEventListener("click", async () => {
      const accepted = window.confirm("这会清空已有会话、告警、动作和动态诱饵资产，是否继续？");
      if (!accepted) return;
      purgeHistoryBtn.disabled = true;
      purgeHistoryBtn.textContent = "清理中…";
      try {
        const payload = await adminFetch("/history/purge", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ confirm: true }),
        });
        if (!payload.ok) throw new Error(payload.message || "清理失败");
        await refresh();
        lastUpdatedEl.textContent = `历史已清空 ${new Date().toLocaleTimeString("zh-CN", { hour12: false })}`;
      } catch (error) {
        lastUpdatedEl.textContent = `清理失败: ${error.message || error}`;
      } finally {
        purgeHistoryBtn.disabled = false;
        purgeHistoryBtn.textContent = "清空历史";
      }
    });

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
