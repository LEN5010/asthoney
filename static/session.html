<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSH Replay</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" data-sidebar-toggle>菜单</button>
        <a class="brand" href="/">Generative Infinite Deception Maze</a>
      </div>
      <div class="topbar-right">
        <span class="topbar-meta" id="sessionMeta">等待加载会话</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-group">
          <div class="sidebar-label">Navigation</div>
          <nav class="nav-list">
            <a class="nav-link" data-nav="overview" href="/"><span>总体态势</span><span class="nav-badge">Graph</span></a>
            <a class="nav-link" data-nav="sessions" href="/sessions/view"><span>SSH 会话</span><span class="nav-badge">Logs</span></a>
            <a class="nav-link" data-nav="docs" href="/docs"><span>API 文档</span><span class="nav-badge">OpenAPI</span></a>
          </nav>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-label">回放</div>
          <div class="inline-meta"></div>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <div>
            <h1 class="content-title">单会话终端回放</h1>
            <div class="content-subtitle"></div>
          </div>
        </div>

        <section class="panel-grid">
          <article class="card span-8">
            <div class="card-header">
              <h2 class="card-title">Terminal Replay</h2>
              <span class="card-meta" id="replayMeta">0 events</span>
            </div>
            <div class="card-body">
              <div class="terminal-wrap">
                <div class="terminal-topbar">
                  <div class="terminal-controls">
                    <button class="terminal-button" id="playBtn">播放</button>
                    <button class="terminal-button" id="pauseBtn">暂停</button>
                    <button class="terminal-button" id="stepBtn">单步</button>
                    <button class="terminal-button" id="resetBtn">重置</button>
                  </div>
                  <div class="terminal-controls">
                    <button class="terminal-button" data-speed="1200">慢速</button>
                    <button class="terminal-button" data-speed="700">标准</button>
                    <button class="terminal-button" data-speed="350">快速</button>
                  </div>
                </div>
                <div class="terminal-screen" id="terminalScreen">
                  <div class="empty-state">等待终端回放数据</div>
                </div>
              </div>
            </div>
          </article>

          <aside class="span-4">
            <div class="card">
              <div class="card-header">
                <h2 class="card-title">AI 分析</h2>
                <span class="card-meta" id="analysisSource">pending</span>
              </div>
              <div class="card-body">
                <div class="analysis-grid" id="analysisCard">
                  <div class="empty-state">等待 AI 分析</div>
                </div>
              </div>
            </div>
            <div class="card" style="margin-top:16px;">
              <div class="card-header">
                <h2 class="card-title">Intent Timeline</h2>
                <span class="card-meta" id="intentMeta">0 intents</span>
              </div>
              <div class="card-body">
                <div class="stack" id="intentList">
                  <div class="empty-state">暂无意图数据</div>
                </div>
              </div>
            </div>
          </aside>
        </section>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script>
    initLayout("sessions");

    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id");
    const sessionMetaEl = document.getElementById("sessionMeta");
    const terminalScreenEl = document.getElementById("terminalScreen");
    const replayMetaEl = document.getElementById("replayMeta");
    const analysisCardEl = document.getElementById("analysisCard");
    const analysisSourceEl = document.getElementById("analysisSource");
    const intentListEl = document.getElementById("intentList");
    const intentMetaEl = document.getElementById("intentMeta");
    const playBtn = document.getElementById("playBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const stepBtn = document.getElementById("stepBtn");
    const resetBtn = document.getElementById("resetBtn");
    const speedButtons = document.querySelectorAll("[data-speed]");

    let transcript = [];
    let replayIndex = 0;
    let replayTimer = null;
    let replaySpeed = 700;

    function buildTerminalLine(item) {
      if (item.direction === "attacker_to_maze") {
        return `
          <div class="terminal-line meta">${escapeHtml(item.created_at || "n/a")} | ${escapeHtml(item.hostname || "unknown")}</div>
          <div class="terminal-line prompt">${escapeHtml(item.prompt || "$ ")}${escapeHtml(item.payload || "")}</div>
        `;
      }
      const promptLine = item.prompt ? `<div class="terminal-line prompt">${escapeHtml(item.prompt)}</div>` : "";
      const outputLine = item.payload ? `<div class="terminal-line output">${escapeHtml(item.payload)}</div>` : "";
      return `
        <div class="terminal-line meta">${escapeHtml(item.created_at || "n/a")} | ${escapeHtml(item.hostname || "unknown")}</div>
        ${outputLine}
        ${promptLine}
      `;
    }

    function renderReplayFrame() {
      if (!transcript.length) {
        terminalScreenEl.innerHTML = '<div class="empty-state">暂无对话数据</div>';
        return;
      }
      terminalScreenEl.innerHTML = transcript.slice(0, replayIndex).map(buildTerminalLine).join("");
      terminalScreenEl.scrollTop = terminalScreenEl.scrollHeight;
    }

    function stopReplay() {
      if (replayTimer) {
        clearInterval(replayTimer);
        replayTimer = null;
      }
    }

    function stepReplay() {
      if (replayIndex >= transcript.length) {
        stopReplay();
        return;
      }
      replayIndex += 1;
      renderReplayFrame();
      replayMetaEl.textContent = `${replayIndex}/${transcript.length} events`;
    }

    function startReplay() {
      stopReplay();
      replayTimer = setInterval(() => {
        if (replayIndex >= transcript.length) {
          stopReplay();
          return;
        }
        stepReplay();
      }, replaySpeed);
    }

    function resetReplay() {
      stopReplay();
      replayIndex = 0;
      replayMetaEl.textContent = `0/${transcript.length} events`;
      renderReplayFrame();
    }

    playBtn.addEventListener("click", startReplay);
    pauseBtn.addEventListener("click", stopReplay);
    stepBtn.addEventListener("click", stepReplay);
    resetBtn.addEventListener("click", resetReplay);
    speedButtons.forEach((button) => {
      button.addEventListener("click", () => {
        replaySpeed = Number(button.getAttribute("data-speed")) || 700;
        if (replayTimer) startReplay();
      });
    });

    function renderAnalysis(analysis) {
      analysisSourceEl.textContent = escapeHtml(analysis.analysis_source || "unknown");
      analysisCardEl.innerHTML = `
        <div class="list-item"><strong>结论摘要</strong><div class="inline-meta">${escapeHtml(analysis.summary || "暂无结论")}</div></div>
        <div class="list-item"><strong>攻击目的</strong><div class="inline-meta">${escapeHtml(analysis.objective || "未知")}</div></div>
        <div class="list-item"><strong>风险等级</strong><div style="margin-top:8px;"><span class="pill ${severityClass(analysis.risk_level)}">${escapeHtml(analysis.risk_level || "unknown")}</span></div></div>
        <div class="list-item"><strong>非真人 Agent 判断</strong><div class="inline-meta">${analysis.likely_non_human_test_agent ? "是" : "否"}<br>${escapeHtml((analysis.likely_non_human_reasons || []).join(" | ") || "无")}</div></div>
        <div class="list-item"><strong>手段提炼</strong><div class="inline-meta">${escapeHtml((analysis.techniques || []).join(" | ") || "无")}</div></div>
        <div class="list-item"><strong>处置建议</strong><div class="inline-meta">${escapeHtml((analysis.suggested_actions || []).join("\n") || "无")}</div></div>
      `;
    }

    function renderIntents(intents) {
      intentMetaEl.textContent = `${intents.length} intents`;
      if (!intents.length) {
        intentListEl.innerHTML = '<div class="empty-state">暂无意图数据</div>';
        return;
      }
      intentListEl.innerHTML = intents.map((intent) => `
        <div class="list-item">
          <strong>${escapeHtml(intent.category || "unknown")}</strong>
          <div class="inline-meta">
            ${escapeHtml(intent.created_at || "n/a")}<br>
            confidence=${escapeHtml(intent.confidence || "n/a")}<br>
            ${escapeHtml(intent.summary || "")}
          </div>
        </div>
      `).join("");
    }

    async function loadSession() {
      if (!sessionId) {
        sessionMetaEl.textContent = "缺少 session_id 参数";
        return;
      }
      try {
        const [detailResp, analysisResp] = await Promise.all([
          fetch(`/sessions/${encodeURIComponent(sessionId)}`),
          fetch(`/sessions/${encodeURIComponent(sessionId)}/analysis`),
        ]);
        const detail = await detailResp.json();
        const analysis = await analysisResp.json();
        const session = detail.session || {};
        transcript = (detail.transcript || []).map((item, index, items) => {
          if (item.direction === "attacker_to_maze") {
            const next = items[index + 1];
            if (next && next.direction === "maze_to_attacker" && next.prompt) {
              return { ...item, prompt: next.prompt };
            }
          }
          return item;
        });
        sessionMetaEl.textContent = `${session.session_id || "unknown"} | ${session.source_ip || "unknown"} | ${session.entry_hostname || session.entry_asset_id || "unknown"}`;
        replayMetaEl.textContent = `0/${transcript.length} events`;
        renderReplayFrame();
        renderAnalysis(analysis);
        renderIntents(detail.intents || []);
      } catch (error) {
        sessionMetaEl.textContent = `加载失败: ${error}`;
      }
    }

    loadSession();
  </script>
</body>
</html>
