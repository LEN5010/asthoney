<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>攻击者画像 · ASTHONEY 欺骗蜜网</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="profiles">
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="sidebar-toggle" data-sidebar-toggle>菜单</button>
        <a class="brand" href="/"><span class="brand-mark"></span>ASTHONEY<span class="brand-sub">欺骗防御工作台</span></a>
      </div>
      <div class="topbar-right"><span class="environment-label">课程实验环境 · 模拟处置</span>
        <span class="topbar-meta" id="lastUpdated">等待同步</span>
        <span class="health-dot" id="healthDot">检测中</span>
      </div>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="sidebar-group">
          <div class="sidebar-label">工作空间</div>
          <nav class="nav-list"></nav>
        </div>
        <div class="sidebar-group">
          <div class="sidebar-label">系统状态</div>
          <div class="shell-status" id="shellStatus">
            <div class="shell-status-row"><span>加载中…</span></div>
          </div>
        </div>
      </aside>

      <main class="content">
        <div class="content-header">
          <div>
            <div class="eyebrow">ASTHONEY / 安全运营</div>
            <h1 class="content-title">攻击者威胁画像</h1>
            <div class="content-subtitle">按来源聚合行为，依据攻击深度与告警解释风险。</div>
          </div>
          <div class="header-actions">
            <a class="link-button" href="/attack/view">攻击矩阵</a>
            <button class="button" id="refreshBtn" type="button">刷新数据</button>
          </div>
        </div>

        <section class="kpi-row">
          <div class="kpi">
            <div class="kpi-label"><span class="dot" style="background: var(--cat-1);"></span>来源数</div>
            <p class="kpi-value" id="kpiTotal">0</p>
            <div class="kpi-sub">已观测到的攻击源 IP</div>
          </div>
          <div class="kpi">
            <div class="kpi-label"><span class="dot" style="background: var(--status-critical);"></span>模拟隔离</div>
            <p class="kpi-value" id="kpiQuarantined">0</p>
            <div class="kpi-sub">模拟隔离动作覆盖的来源</div>
          </div>
          <div class="kpi">
            <div class="kpi-label"><span class="dot" style="background: var(--cat-4);"></span>高危以上</div>
            <p class="kpi-value" id="kpiHigh">0</p>
            <div class="kpi-sub">风险等级为高危或严重</div>
          </div>
        </section>

        <section class="panel-grid">
          <article class="card span-8">
            <div class="card-header">
              <h2 class="card-title">来源排序</h2>
              <span class="card-meta" id="profileCount">0 个画像</span>
            </div>
            <div class="card-body">
              <div class="table cols-profiles">
                <div class="table-head">
                  <div>来源</div>
                  <div>风险</div>
                  <div>会话</div>
                  <div>命令</div>
                  <div>战术</div>
                  <div>状态</div>
                  <div>操作</div>
                </div>
                <div id="profileRows" class="rows">
                  <div class="skeleton" aria-hidden="true">
                    <div class="skeleton-line" style="width:90%"></div>
                    <div class="skeleton-line" style="width:75%"></div>
                    <div class="skeleton-line" style="width:60%"></div>
                  </div>
                </div>
              </div>
            </div>
          </article>

          <article class="card span-4">
            <div class="card-header">
              <h2 class="card-title">分项依据</h2>
              <span class="card-meta" id="detailMeta">选择一个来源</span>
            </div>
            <div class="card-body">
              <div id="profileDetail">
                <div class="empty-state">点击左侧来源，查看为什么是这个分数。</div>
              </div>
            </div>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="/static/app.js"></script>
  <script src="/static/pages/profiles.js" defer></script>
</body>
</html>
